name: Publish site

# Builds the static site and force-pushes it to main-selfhost, which is what
# GitHub Pages serves.
#
# Two triggers, because one commit in three comes from a person and the rest come
# from a robot.
#
# A commit made with GITHUB_TOKEN — every ingest — starts no further workflow. That
# is deliberate on GitHub's part, to stop workflows triggering each other for ever,
# and it is why `workflow_run` is here: the ingests finishing is the signal, not
# their commits. A push by a person does fire normally, and that case had no trigger
# at all, so a change to the site itself sat undeployed until a scheduled ingest
# happened to finish.
#
# `workflow_run` fires whether or not the ingest committed anything, and the
# schedules add up to more than a dozen triggers a day. Most find nothing, so the
# job first compares the tip of main-node against the commit the live site was built
# from and stops there when they match.
#
# When it does build, only what changed is pushed: the build id is derived from the
# contents of data/, so identical data gives byte-identical output and git sends
# nothing but the commit object.

on:
  # A code change, pushed by a person. GITHUB_TOKEN commits — every ingest — start
  # no workflow, which is what workflow_run below is for; a human push is the case
  # that trigger cannot see, and without this one a change to the site itself sat
  # undeployed until the next scheduled ingest happened to finish. Markdown is
  # ignored because none of it is built into the site.
  push:
    branches: [main-node]
    paths-ignore:
      - '**.md'
  workflow_run:
    workflows:
      - Update decklists
      - Update card archive
      - Update rules data
      - Update spoilers
      - Update spoilers from Discord
      - Refresh prices
      - Update events
      - Update matchups
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time. Two force pushes racing at the same ref is how a deploy
# ends up neither of the two builds.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    # Do not publish on top of a failed ingest. A push and a manual run have no
    # `workflow_run` to read, so they have to be named: without them the job is
    # skipped, which is the silent way for this trigger to do nothing at all.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # None of these are secret — every NEXT_PUBLIC_ value is compiled into the
      # browser bundle anyway. They live here rather than in .env.local because that
      # file is gitignored and never reaches a runner.
      NEXT_PUBLIC_CDN_URL: https://poneglyph-art.pages.dev
      NEXT_PUBLIC_BASE_PATH: /Poneglyph
      NEXT_PUBLIC_SITE_URL: https://carminelaluna.github.io/Poneglyph
      PONEGLYPH_SITE_BRANCH: main-selfhost

      # Accounts. Plain values rather than secrets, and deliberately: a NEXT_PUBLIC_
      # variable is compiled into the browser bundle, so the anon key is readable by
      # anyone who opens the site either way. Hiding it in a secret would suggest a
      # confidentiality it does not have. What protects the data is the row-level
      # policies in supabase/schema.sql.
      #
      # SUPABASE_SERVICE_ROLE_KEY bypasses those policies and is a real secret. It
      # lives in the repository secrets and is used only by the submissions ingest.
      NEXT_PUBLIC_SUPABASE_URL: https://wftkmhvxrlmyvaxdpegs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmdGttaHZ4cmxteXZheGRwZWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDEzNTIsImV4cCI6MjEwMzMxNzM1Mn0.PWQmj63nw2zOi5t1E7WyzGbf7rddBVNCRndQnB79r6o

    steps:
      # Always the source branch. A workflow_run event carries the SHA of the run
      # that triggered it, and checking that out would build whatever the ingest
      # started from rather than what it just committed.
      - uses: actions/checkout@v5
        with:
          ref: main-node
          # Deep enough to read the published branch's marker file below.
          fetch-depth: 0

      # Five schedules finishing is twelve triggers a day, and an ingest that found
      # nothing still finishes successfully. build-static.mjs records the commit it
      # built from; if that is still the tip of main-node, the output would be
      # identical to what is already live and there is nothing to do.
      - name: Has the source moved?
        id: moved
        run: |
          git fetch --depth 1 origin main-selfhost 2>/dev/null || true
          published=$(git show origin/main-selfhost:.source 2>/dev/null || echo none)
          current=$(git rev-parse HEAD)
          echo "published=$published"
          echo "current=$current"
          if [ "$published" = "$current" ] && [ "${{ github.event_name }}" != 'workflow_dispatch' ]; then
            echo 'Source unchanged since the last publish — nothing to build.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.moved.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.moved.outputs.skip != 'true'

      # The same three checks the Check workflow runs on a push. They are repeated
      # here because a push starts both workflows at once, so Check failing would
      # not by itself stop this one from deploying — and this is the run that puts
      # something in front of a reader. Twenty seconds against a four-minute export.
      - name: Verify
        if: steps.moved.outputs.skip != 'true'
        run: npm run verify

      - name: Build the static site
        if: steps.moved.outputs.skip != 'true'
        run: npm run build:static

      - name: Push to main-selfhost
        if: steps.moved.outputs.skip != 'true'
        env:
          # The workflow token, in the URL. It is scoped to this repository and
          # expires with the job.
          PONEGLYPH_SITE_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: npm run deploy:site

      - name: Summary
        if: always()
        run: |
          if [ ! -d out ]; then
            echo '## Nothing to publish' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'The source has not moved since the last build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Site published'
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| files | $(find out -type f | wc -l) |"
            echo "| size | $(du -sh out | cut -f1) |"
            echo "| build id | $(cat .next/BUILD_ID 2>/dev/null || echo '—') |"
            echo "| source | $(cat out/.source 2>/dev/null || echo '—') |"
            echo "| branch | main-selfhost |"
          } >> "$GITHUB_STEP_SUMMARY"
