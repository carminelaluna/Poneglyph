name: Refresh prices

# Card text changes when a set ships; prices change every day. This runs the same
# ingest on a faster cadence so market figures stay current between set releases.
#
# It is a separate workflow so the two cadences can be tuned independently, and so
# a price-source outage never blocks a card-list update.
on:
  schedule:
    - cron: '40 5,17 * * *' # twice daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: node scripts/ingest.mjs

      - name: Commit if prices moved
        run: |
          git config user.name 'poneglyph-bot'
          git config user.email 'poneglyph-bot@users.noreply.github.com'
          git add data public/data
          # meta.json carries a fresh timestamp on every run, so this compares the
          # content with those fields stripped rather than naming files to skip —
          # the naming approach missed the browser payloads, which are stamped too.
          if ! node scripts/substantive-change.mjs; then
            git reset
            echo 'No price movement.'
            exit 0
          fi
          git commit -m 'data: refresh market prices'
          git push
