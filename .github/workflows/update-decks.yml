name: Update decklists

# Pulls new tournament results from Limitless.
#
# Limitless allows 50 requests per 5 minutes, so a run is bounded by a request
# budget rather than by how many tournaments exist. The ingest is resumable: it
# records which tournaments it has already read and continues from there, so a
# scheduled run costs a handful of requests once the archive has caught up.
#
# It does not backfill on its own, and the comment here used to say it did.
# Discovery reads the tournament listing newest first and stops at the first page
# whose every entry has already been seen, because that is where new events
# arrive — correct for keeping up, and it means no budget on earth reaches page
# twelve. `--backfill` is the input that pages past it; it exists for a one-off
# run, not for the schedule, which would spend 57 requests a day rediscovering
# events it already has.
on:
  schedule:
    # Twice daily. Most online events finish in the evening in one region or
    # another, so two passes keep the metagame within about half a day.
    - cron: '20 7,19 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Request budget for this run'
        type: string
        default: '300'
      since:
        description: 'Ignore tournaments before this date (YYYY-MM-DD)'
        type: string
        default: ''
      backfill:
        description: 'Page past what the archive already has, back to --since'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-decks
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    # A budget of 300 requests spends roughly 30 minutes waiting out rate-limit
    # windows, so the job needs room well past the 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pull tournament decklists
        run: |
          ARGS="--max ${{ inputs.max || '300' }}"
          if [ -n "${{ inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ inputs.since }}"
          else
            # Rolling three-month window: the current metagame, not its history.
            ARGS="$ARGS --since $(date -u -d '3 months ago' +%Y-%m-%d)"
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ARGS="$ARGS --backfill"
          fi
          echo "Running: node scripts/ingest-decks.mjs $ARGS"
          node scripts/ingest-decks.mjs $ARGS

      # Approved organizer submissions, read before build-indexes so they are part
      # of what gets derived. Region indexes rebuild after any ingest anyway.
      #
      # The URL is not a secret — it ships in the browser bundle under its
      # NEXT_PUBLIC_ name — so it is written here in the open, exactly as
      # publish-site.yml writes it. It used to be read from `secrets.SUPABASE_URL`,
      # a secret that had never been created, so the step exited 1 on every single
      # run for a day; and because the failure was swallowed and never looked at,
      # the job stayed green. What was missing was not the failing, it was the
      # looking.
      #
      # So it is continue-on-error **and** checked, at the end of the job. It has to
      # be that way round because of the ordering: by the time this runs, the deck
      # ingest has already spent thirty minutes of request budget, and stopping here
      # would mean those decklists are never committed — the whole archive frozen
      # over a subsystem that may have no rows in it at all. Fold the submissions in
      # when it works, commit the decks either way, and go red at the end.
      - name: Pull approved submissions
        id: submissions
        continue-on-error: true
        env:
          SUPABASE_URL: https://wftkmhvxrlmyvaxdpegs.supabase.co
          # Bypasses every row-level policy. Secrets only — never NEXT_PUBLIC_.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest-submissions.mjs

      - run: node scripts/build-indexes.mjs

      - name: Commit new decks
        run: |
          git config user.name 'poneglyph-bot'
          git config user.email 'poneglyph-bot@users.noreply.github.com'
          # public/data too: build-indexes.mjs writes every payload the browser
          # fetches there, including the per-entity shards the event, player and
          # deck pages read. Committing only data/ refreshed the archive and left
          # the site serving the previous ingest.
          git add data public/data
          # decks-meta.json changes on every run; only commit if real data moved.
          # This named the four files without timestamps, which was right until the
          # per-entity shards arrived and were not in the list — the same way the
          # `git add` above went stale. Asking the question directly survives that.
          if ! node scripts/substantive-change.mjs; then
            git reset
            echo 'No new decklists.'
            exit 0
          fi
          decks=$(node -p "require('./data/decks-meta.json').counts.decks")
          events=$(node -p "require('./data/decks-meta.json').counts.tournaments")
          git commit -m "data: refresh decklists ($decks decks, $events tournaments)"
          git push

      # Last, so the decklists above are already committed. A bad service role key
      # is a real misconfiguration and should be as loud as any other.
      - name: Did the submissions ingest run?
        if: steps.submissions.outcome == 'failure'
        run: |
          echo '::error title=Submissions ingest failed::Approved organizer submissions were not read. The decklists above were still committed.'
          exit 1

      - name: Summary
        if: always()
        run: |
          node -e "
            const m = require('./data/decks-meta.json');
            const rows = Object.entries(m.thisRun).map(([k, v]) => '| ' + k + ' | ' + v + ' |').join('\n');
            console.log('## Deck ingest\n');
            console.log('| metric | value |\n| --- | --- |');
            console.log('| decks total | ' + m.counts.decks + ' |');
            console.log('| tournaments total | ' + m.counts.tournaments + ' |');
            console.log('| archetypes | ' + m.counts.archetypes + ' |');
            console.log(rows);
          " >> "$GITHUB_STEP_SUMMARY"
