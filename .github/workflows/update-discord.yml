name: Update spoilers from Discord

# Card reveals from a Discord channel, which reach it within minutes and keep
# arriving one card at a time — the shape this archive wants, and the opposite of
# the web source, whose two leak articles sat unmodified for twelve days while the
# spoilers page quietly went stale.
#
# It was manual only until a dispatch run came back green, which is the rule this
# repository keeps arriving at: a schedule that is red for a configuration nobody
# has done yet teaches people to stop reading the run list. It is scheduled now.
# `ingest-spoilers.mjs` runs straight after, because that is what builds the file
# the page reads: without it a reveal would sit in the Discord corpus for up to six
# hours waiting for the other schedule, which defeats the only reason this source
# exists. It reads Top Decks and exits 0 when that host turns the runner away, so a
# refusal there leaves this run green with the Discord corpus committed and the
# page picking it up next time.
#
# What has to be true first, none of which is in this repository:
#
#   1. A Discord *application* with a bot, from the developer portal. Not a user
#      token — automating a user account is against Discord's terms.
#   2. The **Message Content** privileged intent switched on. It is a checkbox for
#      an app this size and it is not optional: without it Discord returns the
#      content, embeds and attachments empty, and this ingest reads a channel full
#      of reveals and correctly finds nothing.
#   3. The bot invited to the server with View Channel and Read Message History.
#      Inviting needs Manage Server on that guild.
#   4. Two repository secrets: DISCORD_BOT_TOKEN and DISCORD_SPOILER_CHANNEL.
#
# The token reads a private channel, so it lives in Actions secrets and nowhere
# else — never in .env.local, and never under a NEXT_PUBLIC_ name, which would
# compile it into the browser bundle.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-read the channel from the start instead of from the last message'
        type: boolean
        default: false
      inspect:
        description: 'Report the shape of what came back — use when a run finds no cards'
        type: boolean
        default: false
  schedule:
    # Every two hours. This is the fast source and its whole point is minutes, not
    # days; a page of 100 messages is one request, so the schedule costs nothing.
    - cron: '15 */2 * * *'

permissions:
  contents: write

concurrency:
  group: update-discord
  cancel-in-progress: true

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The only ingest that needs an install: `sharp` turns a phone photo into a
      # 320px WebP, and it is a devDependency rather than something to hand-roll.
      - run: npm ci

      - name: Read the spoiler channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SPOILER_CHANNEL: ${{ secrets.DISCORD_SPOILER_CHANNEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.all }}" = "true" ]; then
            ARGS="$ARGS --all"
          fi
          if [ "${{ inputs.inspect }}" = "true" ]; then
            ARGS="$ARGS --inspect"
          fi
          node scripts/ingest-discord.mjs $ARGS

      # Rebuilds data/spoilers.json, which is what the page imports.
      - run: node scripts/ingest-spoilers.mjs

      - name: Commit what moved
        run: |
          git config user.name 'poneglyph-bot'
          git config user.email 'poneglyph-bot@users.noreply.github.com'
          # public/spoilers too, and this is the third time this repository has
          # learned it: a workflow that stages only what it expects to change
          # throws away what it actually wrote. The thumbnails were written in the
          # runner and discarded here, so the corpus said every EB-05 card had a
          # picture and the page pointed at twelve files that did not exist.
          git add data public/data
          # Only if it exists: `git add` on a missing pathspec is fatal, and under
          # `bash -e` that takes the whole step down — which is how the fix for the
          # unstaged thumbnails failed on the very next run, before any had been
          # made again.
          if [ -d public/spoilers ]; then git add public/spoilers; fi
          # generatedAt and durationMs change on every run, so a plain diff would
          # commit, rebuild and redeploy the site to publish a new timestamp.
          if ! node scripts/substantive-change.mjs; then
            git reset
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'data: refresh spoilers from Discord'
          git push
