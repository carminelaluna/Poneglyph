name: Update rules data

# The banlist changes rarely and matters immediately when it does.
#
# This used to run the Top Decks ingest as well, on the grounds that both were
# cheap. They are, but they do not fail the same way: Top Decks is fetched from a
# host that filters GitHub's addresses, and when that ingest went red the commit
# step below was never reached - so the banlist was rebuilt and discarded every
# eight hours for five days while the published list stayed on April's. It has
# its own workflow now, `Update Top Decks archives`.
on:
  schedule:
    - cron: '25 */8 * * *' # every 8 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Refuses to write a broken result, so a bad answer leaves the last good
      # banlist in place rather than clearing the page. An entirely empty parse
      # fails instead, because it means the layout changed - and a banlist with
      # nothing on it is a claim rather than an absence.
      - run: node scripts/ingest-banlist.mjs

      # Region indexes are derived from every corpus, so they rebuild after any ingest.
      - run: node scripts/build-indexes.mjs

      - name: Commit what moved
        run: |
          git config user.name 'poneglyph-bot'
          git config user.email 'poneglyph-bot@users.noreply.github.com'
          # Both directories wholesale. Naming the files by hand went stale the
          # moment build-indexes.mjs started writing the per-entity shards, and a
          # missing payload does not fail anything — the page just says "not found".
          git add data public/data
          # banlist.json and regions.json are both stamped with generatedAt, so a
          # plain diff reported a change on every run.
          if ! node scripts/substantive-change.mjs; then
            git reset
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'data: refresh banlist'
          git push
