name: Update rules data

# The banlist changes rarely but matters immediately when it does, and Japanese
# deck-list pages gain entries daily. Both are cheap, so they share a schedule.
on:
  schedule:
    - cron: '25 */8 * * *' # every 8 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Each refuses to write a broken result, so a bad answer here leaves the last
      # good data in place rather than clearing the page.
      #
      # That was aspirational for the Top Decks ingest until it was not: this host
      # answers some datacenter IPs with a challenge, and on 2026-09-02 it served
      # every one of its forty pages to this runner as a clean 200 holding no
      # decks. The ingest wrote both corpora away to nothing and build-indexes
      # then died on a null date, which is the only reason the commit step never
      # ran. `scripts/corpus-guard.mjs` is the check that was missing, and it
      # warns rather than failing — a refusal upstream is not a breakage here,
      # and a job that goes red every eight hours for someone else's filter is a
      # job nobody reads.
      - run: node scripts/ingest-banlist.mjs
      - run: node scripts/ingest-topdecks.mjs

      # Region indexes are derived from every corpus, so they rebuild after any ingest.
      - run: node scripts/build-indexes.mjs

      - name: Commit what moved
        run: |
          git config user.name 'poneglyph-bot'
          git config user.email 'poneglyph-bot@users.noreply.github.com'
          # Both directories wholesale. Naming the files by hand went stale the
          # moment build-indexes.mjs started writing the per-entity shards, and a
          # missing payload does not fail anything — the page just says "not found".
          git add data public/data
          # banlist.json and regions.json are both stamped with generatedAt, so a
          # plain diff reported a change on every run.
          if ! node scripts/substantive-change.mjs; then
            git reset
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'data: refresh banlist and Top Decks archives'
          git push
